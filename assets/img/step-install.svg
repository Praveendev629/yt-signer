<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" fill="none" font-family="Inter, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171227"/>
      <stop offset="1" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="btn" x1="248" y1="404" x2="342" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff2d55"/>
      <stop offset="0.55" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="480" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="60" cy="90" r="90" fill="#e11d48" opacity="0.14"/>
  <circle cx="430" cy="640" r="110" fill="#6d28d9" opacity="0.18"/>

  <!-- phone -->
  <rect x="95" y="40" width="290" height="640" rx="34" fill="#0d0b14" stroke="#332b52" stroke-width="3"/>
  <rect x="107" y="52" width="266" height="616" rx="26" fill="#14121f"/>
  <rect x="205" y="60" width="70" height="14" rx="7" fill="#0d0b14"/>
  <text x="127" y="92" fill="#a5a0bb" font-size="11" font-weight="600">9:41</text>
  <rect x="326" y="82" width="22" height="10" rx="3" fill="#a5a0bb" opacity="0.7"/>
  <rect x="331" y="84" width="14" height="6" rx="2" fill="#14121f"/>

  <!-- file row behind -->
  <rect x="125" y="110" width="230" height="52" rx="14" fill="#1e1a30" stroke="#332b52"/>
  <rect x="141" y="124" width="24" height="24" rx="6" fill="rgba(255,45,85,0.22)"/>
  <text x="153" y="141" fill="#ff2d55" font-size="11" font-weight="700" text-anchor="middle">APK</text>
  <text x="176" y="134" fill="#f4f2ff" font-size="12.5" font-weight="600">YT-Signer.apk</text>
  <text x="176" y="150" fill="#767089" font-size="10.5">8.0 MB · Just now</text>

  <!-- dim -->
  <rect x="107" y="52" width="266" height="616" rx="26" fill="#05040a" opacity="0.6"/>

  <!-- installer dialog -->
  <rect x="127" y="206" width="226" height="272" rx="20" fill="#1e1a30" stroke="#3b3360" stroke-width="1.5"/>
  <rect x="222" y="232" width="36" height="36" rx="10" fill="url(#brand)"/>
  <path d="M235 240l14 10-14 10z" fill="#fff"/>
  <text x="240" y="300" fill="#f4f2ff" font-size="16" font-weight="700" text-anchor="middle">YT Signer</text>
  <text x="240" y="318" fill="#767089" font-size="11" text-anchor="middle">Version 1.0</text>

  <text x="240" y="352" fill="#a5a0bb" font-size="12" text-anchor="middle">Do you want to install this</text>
  <text x="240" y="370" fill="#a5a0bb" font-size="12" text-anchor="middle">app on your device?</text>

  <text x="166" y="436" fill="#a5a0bb" font-size="13.5" font-weight="600" text-anchor="middle">Cancel</text>
  <g filter="url(#glow)">
    <rect x="248" y="412" width="94" height="36" rx="18" fill="url(#btn)"/>
    <text x="295" y="435" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">Install</text>
  </g>
  <rect x="239" y="403" width="112" height="54" rx="27" fill="none" stroke="#ff2d55" stroke-width="3" stroke-dasharray="11 8"/>

  <!-- progress + success -->
  <rect x="145" y="504" width="190" height="104" rx="16" fill="#1a162a" stroke="#332b52"/>
  <text x="163" y="532" fill="#f4f2ff" font-size="12.5" font-weight="600">Installing…</text>
  <rect x="163" y="546" width="154" height="10" rx="5" fill="#241f38"/>
  <rect x="163" y="546" width="112" height="10" rx="5" fill="url(#btn)"/>
  <circle cx="176" cy="584" r="11" fill="rgba(52,211,153,0.18)"/>
  <path d="M171 584l4 4 7-8" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="196" y="589" fill="#34d399" font-size="12" font-weight="600">App installed</text>

  <!-- callout -->
  <rect x="146" y="702" width="188" height="46" rx="23" fill="#1a162a" stroke="#ff2d55" stroke-width="2"/>
  <circle cx="174" cy="725" r="6" fill="#ff2d55"/>
  <text x="254" y="731" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Tap Install</text>
</svg>
