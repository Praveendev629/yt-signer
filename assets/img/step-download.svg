<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" fill="none" font-family="Inter, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171227"/>
      <stop offset="1" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="brand" x1="145" y1="278" x2="335" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff2d55"/>
      <stop offset="0.55" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="480" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="60" cy="90" r="90" fill="#e11d48" opacity="0.14"/>
  <circle cx="430" cy="640" r="110" fill="#6d28d9" opacity="0.18"/>

  <!-- phone -->
  <rect x="95" y="40" width="290" height="640" rx="34" fill="#0d0b14" stroke="#332b52" stroke-width="3"/>
  <rect x="107" y="52" width="266" height="616" rx="26" fill="#14121f"/>
  <rect x="205" y="60" width="70" height="14" rx="7" fill="#0d0b14"/>
  <text x="127" y="92" fill="#a5a0bb" font-size="11" font-weight="600">9:41</text>
  <rect x="326" y="82" width="22" height="10" rx="3" fill="#a5a0bb" opacity="0.7"/>
  <rect x="331" y="84" width="14" height="6" rx="2" fill="#14121f"/>

  <!-- browser bar -->
  <rect x="125" y="106" width="230" height="34" rx="17" fill="#1e1a30" stroke="#332b52"/>
  <path d="M141 121v-3a5 5 0 0 1 10 0v3" stroke="#8b5cf6" stroke-width="1.6" fill="none"/>
  <rect x="139" y="121" width="14" height="10" rx="2" fill="#8b5cf6"/>
  <text x="160" y="127" fill="#a5a0bb" font-size="12">ytsigner.app</text>

  <!-- page -->
  <text x="240" y="188" fill="#f4f2ff" font-size="19" font-weight="700" text-anchor="middle">Download YT Signer</text>
  <text x="240" y="210" fill="#767089" font-size="11.5" text-anchor="middle">Latest official build</text>

  <rect x="168" y="224" width="144" height="28" rx="14" fill="rgba(139,92,246,0.16)" stroke="rgba(139,92,246,0.5)"/>
  <text x="240" y="243" fill="#c4b5fd" font-size="12" font-weight="600" text-anchor="middle">v1.0  ·  ~108 MB</text>

  <!-- download button -->
  <g filter="url(#glow)">
    <rect x="145" y="286" width="190" height="58" rx="29" fill="url(#brand)"/>
    <path d="M176 303v13m0 0l-5-5m5 5l5-5M170 323h12" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="258" y="321" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Download APK</text>
  </g>
  <rect x="133" y="274" width="214" height="82" rx="41" fill="none" stroke="#ff2d55" stroke-width="3" stroke-dasharray="12 9" opacity="0.95"/>

  <!-- content placeholders -->
  <rect x="145" y="384" width="190" height="9" rx="4.5" fill="#241f38"/>
  <rect x="145" y="402" width="150" height="9" rx="4.5" fill="#241f38"/>

  <rect x="145" y="432" width="190" height="96" rx="16" fill="#1a162a" stroke="#332b52"/>
  <circle cx="171" cy="464" r="14" fill="rgba(255,45,85,0.2)"/>
  <path d="M165 464l4 4 8-8" stroke="#ff2d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="194" y="454" width="112" height="8" rx="4" fill="#2c2644"/>
  <rect x="194" y="470" width="86" height="8" rx="4" fill="#241f38"/>
  <rect x="163" y="498" width="154" height="8" rx="4" fill="#241f38"/>

  <rect x="145" y="546" width="190" height="70" rx="16" fill="#1a162a" stroke="#332b52"/>
  <rect x="163" y="566" width="120" height="8" rx="4" fill="#2c2644"/>
  <rect x="163" y="584" width="84" height="8" rx="4" fill="#241f38"/>

  <!-- callout -->
  <rect x="130" y="702" width="220" height="46" rx="23" fill="#1a162a" stroke="#ff2d55" stroke-width="2"/>
  <circle cx="158" cy="725" r="6" fill="#ff2d55"/>
  <text x="252" y="731" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Tap Download APK</text>
</svg>
