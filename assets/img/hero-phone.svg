<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" fill="none" font-family="Inter, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="btn" x1="131" y1="470" x2="349" y2="526" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff2d55"/>
      <stop offset="0.55" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(240 360) rotate(90) scale(330 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="720" rx="32" fill="#0b0912"/>
  <rect width="480" height="720" rx="32" fill="url(#halo)"/>
  <circle cx="70" cy="90" r="80" fill="#e11d48" opacity="0.16"/>
  <circle cx="420" cy="620" r="100" fill="#6d28d9" opacity="0.2"/>

  <!-- phone -->
  <rect x="93" y="42" width="294" height="636" rx="36" fill="#0d0b14" stroke="#3a3160" stroke-width="3"/>
  <rect x="105" y="54" width="270" height="612" rx="28" fill="#14121f"/>
  <rect x="205" y="62" width="70" height="14" rx="7" fill="#0d0b14"/>
  <text x="126" y="94" fill="#a5a0bb" font-size="11" font-weight="600">9:41</text>
  <rect x="330" y="84" width="22" height="10" rx="3" fill="#a5a0bb" opacity="0.7"/>
  <rect x="335" y="86" width="14" height="6" rx="2" fill="#14121f"/>

  <!-- header -->
  <rect x="127" y="114" width="28" height="28" rx="9" fill="url(#brand)"/>
  <path d="M136 121l11 7-11 7z" fill="#fff"/>
  <text x="164" y="134" fill="#f4f2ff" font-size="16" font-weight="700">YT Signer</text>
  <rect x="304" y="117" width="52" height="24" rx="12" fill="rgba(139,92,246,0.16)" stroke="rgba(139,92,246,0.5)"/>
  <path d="M314 129l4 4 7-8" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="340" y="133" fill="#c4b5fd" font-size="10" font-weight="600" text-anchor="middle">Secure</text>

  <text x="127" y="176" fill="#767089" font-size="11" font-weight="700" letter-spacing="1.2">YOUR ACCOUNTS</text>

  <!-- account 1 -->
  <rect x="127" y="190" width="226" height="68" rx="16" fill="#1e1a30" stroke="#332b52"/>
  <circle cx="158" cy="224" r="18" fill="#8b5cf6"/>
  <text x="158" y="229" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">A</text>
  <text x="186" y="219" fill="#f4f2ff" font-size="13" font-weight="600">channel.one</text>
  <text x="186" y="237" fill="#767089" font-size="10.5">one@gmail.com</text>
  <rect x="302" y="213" width="40" height="22" rx="11" fill="rgba(52,211,153,0.14)"/>
  <text x="322" y="228" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Ready</text>

  <!-- account 2 -->
  <rect x="127" y="270" width="226" height="68" rx="16" fill="#1e1a30" stroke="#332b52"/>
  <circle cx="158" cy="304" r="18" fill="#ff2d55"/>
  <text x="158" y="309" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">B</text>
  <text x="186" y="299" fill="#f4f2ff" font-size="13" font-weight="600">channel.two</text>
  <text x="186" y="317" fill="#767089" font-size="10.5">two@gmail.com</text>
  <rect x="302" y="293" width="40" height="22" rx="11" fill="rgba(52,211,153,0.14)"/>
  <text x="322" y="308" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Ready</text>

  <!-- account 3 -->
  <rect x="127" y="350" width="226" height="68" rx="16" fill="#1e1a30" stroke="#332b52"/>
  <circle cx="158" cy="384" r="18" fill="#c026d3"/>
  <text x="158" y="389" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">C</text>
  <text x="186" y="379" fill="#f4f2ff" font-size="13" font-weight="600">channel.three</text>
  <text x="186" y="397" fill="#767089" font-size="10.5">three@gmail.com</text>
  <rect x="302" y="373" width="40" height="22" rx="11" fill="rgba(52,211,153,0.14)"/>
  <text x="322" y="388" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Ready</text>

  <!-- add button -->
  <rect x="131" y="446" width="218" height="56" rx="28" fill="url(#btn)"/>
  <path d="M172 474h16M180 466v16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="256" y="480" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Add account</text>

  <!-- on-device note -->
  <rect x="127" y="526" width="226" height="60" rx="16" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.4)"/>
  <path d="M153 546v-3a6 6 0 0 1 12 0v3" stroke="#a78bfa" stroke-width="1.8" fill="none"/>
  <rect x="151" y="546" width="16" height="12" rx="2.5" fill="#a78bfa"/>
  <text x="178" y="554" fill="#c4b5fd" font-size="11.5" font-weight="600">Sessions stored on device</text>
  <text x="178" y="570" fill="#8b7bb8" font-size="10">No cloud. No tracking.</text>

  <!-- bottom bar -->
  <rect x="127" y="606" width="226" height="42" rx="21" fill="#1a162a" stroke="#332b52"/>
  <circle cx="160" cy="627" r="5" fill="#34d399"/>
  <text x="178" y="632" fill="#a5a0bb" font-size="11.5">All accounts synced locally</text>
</svg>
