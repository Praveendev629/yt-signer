<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" fill="none" font-family="Inter, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171227"/>
      <stop offset="1" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="brand" x1="245" y1="406" x2="340" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff2d55"/>
      <stop offset="0.55" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="480" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="60" cy="90" r="90" fill="#e11d48" opacity="0.14"/>
  <circle cx="430" cy="640" r="110" fill="#6d28d9" opacity="0.18"/>

  <!-- phone -->
  <rect x="95" y="40" width="290" height="640" rx="34" fill="#0d0b14" stroke="#332b52" stroke-width="3"/>
  <rect x="107" y="52" width="266" height="616" rx="26" fill="#14121f"/>
  <rect x="205" y="60" width="70" height="14" rx="7" fill="#0d0b14"/>
  <text x="127" y="92" fill="#a5a0bb" font-size="11" font-weight="600">9:41</text>
  <rect x="326" y="82" width="22" height="10" rx="3" fill="#a5a0bb" opacity="0.7"/>
  <rect x="331" y="84" width="14" height="6" rx="2" fill="#14121f"/>

  <!-- browser behind -->
  <rect x="125" y="106" width="230" height="34" rx="17" fill="#1e1a30" stroke="#332b52"/>
  <path d="M141 121v-3a5 5 0 0 1 10 0v3" stroke="#8b5cf6" stroke-width="1.6" fill="none"/>
  <rect x="139" y="121" width="14" height="10" rx="2" fill="#8b5cf6"/>
  <text x="160" y="127" fill="#a5a0bb" font-size="12">ytsigner.app</text>
  <rect x="145" y="166" width="190" height="9" rx="4.5" fill="#241f38"/>
  <rect x="145" y="184" width="150" height="9" rx="4.5" fill="#241f38"/>
  <rect x="145" y="214" width="190" height="44" rx="22" fill="#241f38"/>

  <!-- dim overlay -->
  <rect x="107" y="52" width="266" height="616" rx="26" fill="#05040a" opacity="0.62"/>

  <!-- security dialog -->
  <rect x="127" y="216" width="226" height="262" rx="20" fill="#1e1a30" stroke="#3b3360" stroke-width="1.5"/>
  <circle cx="240" cy="264" r="24" fill="rgba(139,92,246,0.18)"/>
  <path d="M240 250l10 4v7c0 6.2-4.2 11.7-10 13.8-5.8-2.1-10-7.6-10-13.8v-7l10-4z" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>
  <text x="240" y="316" fill="#f4f2ff" font-size="15" font-weight="700" text-anchor="middle">Install blocked</text>
  <text x="240" y="344" fill="#a5a0bb" font-size="11.5" text-anchor="middle">For your security, your phone is</text>
  <text x="240" y="362" fill="#a5a0bb" font-size="11.5" text-anchor="middle">not allowed to install apps from</text>
  <text x="240" y="380" fill="#a5a0bb" font-size="11.5" text-anchor="middle">this source.</text>

  <text x="168" y="440" fill="#a5a0bb" font-size="13.5" font-weight="600" text-anchor="middle">Cancel</text>
  <g filter="url(#glow)">
    <rect x="245" y="416" width="94" height="36" rx="18" fill="url(#brand)"/>
    <text x="292" y="439" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">Settings</text>
  </g>
  <rect x="236" y="407" width="112" height="54" rx="27" fill="none" stroke="#ff2d55" stroke-width="3" stroke-dasharray="11 8"/>

  <!-- note under dialog -->
  <rect x="145" y="506" width="190" height="72" rx="16" fill="#1a162a" stroke="#332b52"/>
  <circle cx="171" cy="542" r="14" fill="rgba(139,92,246,0.2)"/>
  <path d="M171 535v8m0 4v.5" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="194" y="528" width="112" height="8" rx="4" fill="#2c2644"/>
  <rect x="194" y="546" width="86" height="8" rx="4" fill="#241f38"/>

  <!-- callout -->
  <rect x="122" y="702" width="236" height="46" rx="23" fill="#1a162a" stroke="#ff2d55" stroke-width="2"/>
  <circle cx="150" cy="725" r="6" fill="#ff2d55"/>
  <text x="254" y="731" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Tap Settings → Allow</text>
</svg>
